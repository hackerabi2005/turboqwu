[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvpipe"
version = "0.1.0"
description = "KV-Cache Compression Pipeline and Evaluation Toolkit"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
kvpipe = "kvpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
